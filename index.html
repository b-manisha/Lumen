<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090A" />
    <meta name="description" content="Lumen: a calm, keyboard-first, local-first planner." />
    <title>Lumen</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('lumen:store') || '{}');
        var t = (s.state && s.state.settings && s.state.settings.theme) || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
